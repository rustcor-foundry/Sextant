name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Fast gate on the lx-ws02 self-hosted runner (openSUSE, Rust 1.96 + rustfmt +
  # clippy preinstalled). Whole workspace WITHOUT default features so it never
  # pulls the heavy Servo git dependency. One run step (no Node-based
  # actions/checkout): manual git checkout, then fmt / check / test / clippy.
  fast-linux:
    # lx-ws02 is offline pending a replacement drive. Linux CI belongs on
    # lx-ws01, which is the only Linux runner outside pve1.
    runs-on: [self-hosted, linux, lx-ws01]
    steps:
      - name: Checkout + fmt + check + test + clippy
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          WORK="${RUNNER_TEMP:-/tmp}/sextant-${GITHUB_SHA}"
          rm -rf "$WORK"
          git clone --no-tags "https://${TOKEN}@gitea.w-sky.net/${GITHUB_REPOSITORY}.git" "$WORK"
          git -C "$WORK" fetch --no-tags origin "$GITHUB_SHA" || true
          git -C "$WORK" checkout --quiet "$GITHUB_SHA"

          cd "$WORK/rust"
          cargo fmt --check
          cargo check --workspace --no-default-features --locked
          cargo test --workspace --no-default-features --locked
          cargo clippy --workspace --no-default-features

  # Product gate: the Servo-backed sextant-browser as it ships (default features),
  # on the ws-ws01 Windows runner (MSVC + Servo toolchain). Heavy Servo build, so
  # it runs on push/dispatch only (not every PR). Manual git checkout; a
  # persistent CARGO_TARGET_DIR builds Servo once then incrementally.
  windows-product:
    runs-on: windows
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout + check sextant-browser (default features, Servo)
        shell: pwsh
        env:
          TOKEN: ${{ github.token }}
          CARGO_TARGET_DIR: C:\gitea-runner\cache\sextant-target
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"

          $base = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $work = Join-Path $base "sextant-$($env:GITHUB_SHA)"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          git clone --no-tags "https://$($env:TOKEN)@gitea.w-sky.net/$($env:GITHUB_REPOSITORY).git" $work
          git -C $work checkout --quiet $env:GITHUB_SHA

          # MSVC environment. The repo used to ship rust/.cargo/config.toml with
          # absolute paths to one specific Build Tools install, which only ever
          # worked on this runner. Resolve whatever is installed here instead and
          # import the variables vcvars sets (INCLUDE, LIB, and link.exe on PATH).
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw "No Visual Studio Build Tools with the C++ toolset found" }
          cmd /c "`"$vsPath\VC\Auxiliary\Build\vcvars64.bat`" >nul && set" |
            ForEach-Object {
              if ($_ -match '^([^=]+)=(.*)$') {
                Set-Item -Path "env:$($matches[1])" -Value $matches[2]
              }
            }

          Set-Location "$work\rust"
          cargo check -p sextant-browser --bin sextant-browser --locked
