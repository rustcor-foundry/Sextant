name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # Fast gate on the lx-ws02 self-hosted runner (openSUSE, Rust 1.96 + rustfmt +
  # clippy preinstalled). Whole workspace WITHOUT default features so it never
  # pulls the heavy Servo git dependency. One run step (no Node-based
  # actions/checkout): manual git checkout, then fmt / check / test / clippy.
  #
  # sextant-engine path-depends on ../../../wsky-distiller/distill (a sibling
  # repo, rustcor/wsky-distiller), so we clone that next to the workspace first
  # or cargo metadata can't resolve the workspace. WSKY_TOKEN is a Gitea Actions
  # secret with read access to rustcor/wsky-distiller (the auto github.token is
  # scoped to this repo only).
  fast-linux:
    runs-on: lx-ws02
    steps:
      - name: Checkout + fmt + check + test + clippy
        env:
          TOKEN: ${{ github.token }}
          WSKY_TOKEN: ${{ secrets.WSKY_TOKEN }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"

          WORK="${RUNNER_TEMP:-/tmp}/sextant-${GITHUB_SHA}"
          rm -rf "$WORK"
          git clone --no-tags "https://${TOKEN}@gitea.w-sky.net/${GITHUB_REPOSITORY}.git" "$WORK"
          git -C "$WORK" fetch --no-tags origin "$GITHUB_SHA" || true
          git -C "$WORK" checkout --quiet "$GITHUB_SHA"

          DISTILLER="${RUNNER_TEMP:-/tmp}/wsky-distiller"
          rm -rf "$DISTILLER"
          # Pin the sibling crate to a known-good rev; local dev keeps the live
          # path dep, CI builds against a frozen distill so HEAD drift can't break
          # an unrelated Sextant push. Full clone (no --depth) so the rev resolves.
          git clone --no-tags "https://${WSKY_TOKEN}@gitea.w-sky.net/rustcor/wsky-distiller.git" "$DISTILLER"
          git -C "$DISTILLER" checkout --quiet c12146d891642b96314715d1223ea59bc95bd524

          cd "$WORK/rust"
          # fmt only the Sextant members; --all would also format the external
          # distill path dep (wsky-distiller), which we shouldn't gate on here.
          cargo fmt --check
          cargo check --workspace --no-default-features --locked
          cargo test --workspace --no-default-features --locked
          cargo clippy --workspace --no-default-features

  # Product gate: the Servo-backed sextant-browser as it ships (default features),
  # on the ws-ws01 Windows runner (MSVC + Servo toolchain). Heavy Servo build, so
  # it runs on push/dispatch only (not every PR). Manual git checkout + sibling
  # clone like fast-linux; a persistent CARGO_TARGET_DIR builds Servo once then
  # incrementally. Earlier this job died in 15s on the same missing-distill issue.
  windows-product:
    runs-on: windows
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout + check sextant-browser (default features, Servo)
        shell: pwsh
        env:
          TOKEN: ${{ github.token }}
          WSKY_TOKEN: ${{ secrets.WSKY_TOKEN }}
          CARGO_TARGET_DIR: C:\gitea-runner\cache\sextant-target
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $env:PATH = "$env:USERPROFILE\.cargo\bin;$env:PATH"

          $base = if ($env:RUNNER_TEMP) { $env:RUNNER_TEMP } else { $env:TEMP }
          $work = Join-Path $base "sextant-$($env:GITHUB_SHA)"
          if (Test-Path $work) { Remove-Item -Recurse -Force $work }
          git clone --no-tags "https://$($env:TOKEN)@gitea.w-sky.net/$($env:GITHUB_REPOSITORY).git" $work
          git -C $work checkout --quiet $env:GITHUB_SHA

          $sibling = Join-Path $base 'wsky-distiller'
          if (Test-Path $sibling) { Remove-Item -Recurse -Force $sibling }
          # Pin to the same frozen rev as fast-linux (see note there).
          git clone --no-tags "https://$($env:WSKY_TOKEN)@gitea.w-sky.net/rustcor/wsky-distiller.git" $sibling
          git -C $sibling checkout --quiet c12146d891642b96314715d1223ea59bc95bd524

          Set-Location "$work\rust"
          cargo check -p sextant-browser --bin sextant-browser --locked
