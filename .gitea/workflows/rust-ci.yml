name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  rust-workspace:
    runs-on: ubuntu-latest
    container:
      image: rust:1.89-bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cargo Check
        working-directory: rust
        run: cargo check --workspace

      - name: Cargo Test
        working-directory: rust
        run: cargo test --workspace
