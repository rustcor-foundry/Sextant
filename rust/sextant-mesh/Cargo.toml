[package]
name = "sextant-mesh"
version = "0.1.0"
edition = "2021"
description = "Decentralized P2P mesh networking for Sextant (Chat, Tab Sharing, File Sharing)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
base64 = "0.21"
