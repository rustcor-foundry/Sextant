[package]
name = "sextant-vault"
version = "0.1.0"
edition = "2021"
description = "Hardware-anchored cryptographic security core for Sextant Browser"

[dependencies]
ed25519-dalek = "2.1"
ecdsa = { version = "0.16", features = ["signing", "verifying", "der"] }
p256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
zeroize = { version = "1.7", features = ["derive"] }
aes-gcm = "0.10"
argon2 = "0.5"
subtle = "2.5"
uuid = { version = "1.3", features = ["v4", "serde"] }
hex = "0.4"
bip39 = { version = "2.0", features = ["rand"] }
hmac = "0.12"
sha2 = "0.10"
bs58 = "0.5"
sextant-bio = { path = "../sextant-bio" }
sextant-pq = { path = "../sextant-pq" }
