[package]
name = "sextant-engine"
version = "0.1.0"
edition = "2021"
description = "Parallelized DOM layout and semantic parsing engine for Sextant"

[features]
servo-backend = ["dep:servo"]

[dependencies]
servo = { git = "https://github.com/servo/servo", rev = "d3932a2118d05ab49dcbbd739d05959dbccb2c3a", optional = true }
dpi = "0.1.2"
selectors = "0.25"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"] }
scraper = "0.19"
url = { version = "2.5", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.3", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
rayon = "1.8"
wgpu = "0.19"
sextant-firewall = { path = "../sextant-firewall" }
sextant-bridge = { path = "../sextant-bridge" }
sextant-privacy = { path = "../sextant-privacy" }
rand = "0.8"
# Optional sibling checkout; CI clones wsky-distiller beside this repo. See docs/architecture.md.
distill = { path = "../../../wsky-distiller/distill" }
rustls = { version = "0.23", features = ["ring"] }
