[package]
name = "sextant-bridge"
version = "0.1.0"
edition = "2021"
description = "Neural Bridge for multi-modal perception (audio/video) in Sextant"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
base64 = "0.21"
sextant-privacy = { path = "../sextant-privacy" }
