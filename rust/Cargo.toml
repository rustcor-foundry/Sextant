[workspace]
members = [
    "sextant-vault",
    "sextant-hull",
    "sextant-browser",
    "sextant-engine",
    "sextant-wake",
    "sextant-pilot",
    "sextant-inference",
    "sextant-sync",
    "sextant-log",
    "sextant-firewall",
    "sextant-bridge",
    "sextant-bio",
    "sextant-pq",
    "sextant-mesh",
    "sextant-privacy",
    "sextant-airgap",
    "sextant-mcp",
]
resolver = "2"

[patch.crates-io]
masonry = { path = "vendor/masonry-0.2.0" }
vello = { path = "vendor/vello-0.1.0" }

[profile.dev]
opt-level = 1
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3
debug = 1
