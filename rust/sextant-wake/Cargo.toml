[package]
name = "sextant-wake"
version = "0.1.0"
edition = "2021"
description = "Sovereign memory and semantic distillation storage for Sextant Browser"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
url = { version = "2.5", features = ["serde"] }
sextant-engine = { path = "../sextant-engine" }
