[package]
name = "sextant-hull"
version = "0.1.0"
edition = "2021"
description = "Hardware-accelerated UI shell for Sextant Browser"

[dependencies]
xilem = "0.1"
masonry = "0.2"
vello = "0.1"
wgpu = "0.19"
winit = "0.29"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5"
accesskit = "0.14"
smallvec = "1.13"
sextant-vault = { path = "../sextant-vault" }
sextant-engine = { path = "../sextant-engine" }
sextant-wake = { path = "../sextant-wake" }
sextant-pilot = { path = "../sextant-pilot" }
sextant-sync = { path = "../sextant-sync" }
sextant-bio = { path = "../sextant-bio" }
sextant-mesh = { path = "../sextant-mesh" }
sextant-airgap = { path = "../sextant-airgap" }
sextant-log = { path = "../sextant-log" }
sextant-pq = { path = "../sextant-pq" }
sextant-privacy = { path = "../sextant-privacy" }
sextant-inference = { path = "../sextant-inference" }
url = "2.5"
