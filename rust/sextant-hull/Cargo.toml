[package]
name = "sextant-hull"
version = "0.1.0"
edition = "2021"
description = "Hardware-accelerated UI shell for Sextant Browser"
build = "build.rs"

[features]
default = ["xilem-shell", "servo-backend"]
xilem-shell = [
    "dep:accesskit",
    "dep:masonry",
    "dep:sextant-airgap",
    "dep:sextant-bio",
    "dep:sextant-firewall",
    "dep:sextant-inference",
    "dep:sextant-mesh",
    "dep:sextant-pilot",
    "dep:sextant-pq",
    "dep:sextant-privacy",
    "dep:sextant-sync",
    "dep:sextant-vault",
    "dep:serde",
    "dep:serde_json",
    "dep:smallvec",
    "dep:tokio",
    "dep:vello",
    "dep:wgpu",
    "dep:xilem",
]
servo-backend = [
    "sextant-engine/servo-backend",
    "dep:base64",
    "dep:egui",
    "dep:egui-wgpu",
    "dep:egui-winit",
    "dep:pollster",
    "dep:rustls",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
    "dep:servo",
    "dep:wgpu",
    "dep:windows-sys",
    "dep:winit30",
]

# sextant-hull is now also a library (src/lib.rs): the browser shell. The
# core-loop bin (sextant-browser) and its lite alias live in the sibling
# sextant-browser crate, which depends on this lib.
[[bin]]
name = "sextant-hull"
path = "src/main.rs"
required-features = ["xilem-shell"]

[[bin]]
name = "sextant-servo-direct"
path = "src/servo_direct.rs"
required-features = ["servo-backend"]

[dependencies]
xilem = { version = "0.1", optional = true }
masonry = { version = "0.2", optional = true }
vello = { version = "0.1", optional = true }
wgpu = { version = "0.19", optional = true }
winit = "0.29"
winit30 = { package = "winit", version = "0.30", optional = true }
# egui 0.27 family aligns with winit 0.29 + wgpu 0.19 already in this tree.
# Used to render the hosted-direct parent chrome (address bar, nav, tabs).
egui = { version = "0.27", optional = true }
egui-winit = { version = "0.27", optional = true }
egui-wgpu = { version = "0.27", optional = true }
pollster = { version = "0.3", optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"], optional = true }
base64 = { version = "0.22", optional = true }
softbuffer = "0.4"
tokio = { version = "1.0", features = ["full"], optional = true }
tracing = "0.1"
tracing-subscriber = "0.3"
rustls = { version = "0.23", features = ["ring"], optional = true }
sha2 = { version = "0.10", optional = true }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
dirs = "5"
accesskit = { version = "0.14", optional = true }
smallvec = { version = "1.13", optional = true }
sextant-vault = { path = "../sextant-vault", optional = true }
sextant-engine = { path = "../sextant-engine" }
servo = { git = "https://github.com/servo/servo", branch = "main", optional = true }
sextant-wake = { path = "../sextant-wake" }
sextant-pilot = { path = "../sextant-pilot", optional = true }
sextant-sync = { path = "../sextant-sync", optional = true }
sextant-bio = { path = "../sextant-bio", optional = true }
sextant-mesh = { path = "../sextant-mesh", optional = true }
sextant-airgap = { path = "../sextant-airgap", optional = true }
sextant-firewall = { path = "../sextant-firewall", optional = true }
sextant-log = { path = "../sextant-log" }
sextant-pq = { path = "../sextant-pq", optional = true }
sextant-privacy = { path = "../sextant-privacy", optional = true }
sextant-inference = { path = "../sextant-inference", optional = true }
url = "2.5"

[build-dependencies]
embed-resource = "3.0.9"
