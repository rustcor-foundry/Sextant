[package]
name = "sextant-pq"
version = "0.1.0"
edition = "2021"
description = "Post-quantum cryptographic identity protection for Sextant Personas"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
sha3 = "0.10"
hex = "0.4"
