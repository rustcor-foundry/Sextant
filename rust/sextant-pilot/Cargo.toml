[package]
name = "sextant-pilot"
version = "0.1.0"
edition = "2021"
description = "Agentic orchestration and intent reasoning engine for Sextant Browser"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1.3", features = ["v4", "serde"] }
url = "2.5"
sextant-vault = { path = "../sextant-vault" }
sextant-engine = { path = "../sextant-engine" }
sextant-wake = { path = "../sextant-wake" }
sextant-inference = { path = "../sextant-inference" }
sextant-log = { path = "../sextant-log" }
