[package]
name = "sextant-airgap"
version = "0.1.0"
edition = "2021"
description = "Offline-first local inference and network isolation for Sextant"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.3", features = ["v4", "serde"] }
