[package]
name = "sextant-inference"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
url = { version = "2.2", features = ["serde"] }
